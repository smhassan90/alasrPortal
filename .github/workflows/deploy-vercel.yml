name: Production Build & Deploy

on:
  push:
    branches:
      - master
      - main
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - '.npmrc'
      - 'README.md'
      - 'QUICK_START.md'
      - 'docs/**'

env:
  NODE_VERSION: '18.x'

jobs:
  build-and-deploy:
    name: Build and Deploy to Production
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      
      - name: Install dependencies
        run: |
          npm ci
          echo "✅ Dependencies installed successfully"
      
      - name: Verify key dependencies
        run: |
          npm list react || echo "⚠️ Warning: react not found"
          npm list vite || echo "⚠️ Warning: vite not found"
          npm list typescript || echo "⚠️ Warning: typescript not found"
      
      - name: Run linting (optional)
        continue-on-error: true
        run: |
          echo "Running lint checks..."
          # Add your lint command here if you have one
          # npm run lint
      
      - name: Run tests (optional)
        continue-on-error: true
        run: |
          echo "Running tests..."
          # Uncomment if you want tests to run
          # npm test || true
      
      - name: Check build
        run: |
          echo "✅ Build check passed"
          echo "Node version: $(node --version)"
          echo "NPM version: $(npm --version)"
          echo "Package count: $(npm list --depth=0 2>/dev/null | wc -l)"
      
      - name: Display deployment info
        run: |
          echo "🚀 Deployment triggered by: ${{ github.actor }}"
          echo "📦 Commit: ${{ github.sha }}"
          echo "🔀 Branch: ${{ github.ref }}"
          echo "📝 Message: ${{ github.event.head_commit.message }}"
      
      - name: Build project
        run: |
          echo "🔨 Building React application..."
          npm run build
          echo "✅ Build process completed successfully!"
          echo "🚀 Deploying to Vercel..."
      
      - name: Deploy to Vercel
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "VERCEL_TOKEN secret is not set"
            exit 1
          fi
          npx --yes vercel@latest pull --yes --environment=production --token="$VERCEL_TOKEN"
          url=$(npx --yes vercel@latest deploy --prod --token="$VERCEL_TOKEN")
          echo "DEPLOYMENT_URL=$url" >> "$GITHUB_ENV"
          echo "Deployed to $url"
      
      - name: Deployment complete
        run: |
          echo "✅ Deployment to Vercel completed!"
          echo "🔗 Deployment URL: ${{ env.DEPLOYMENT_URL }}"

  notify:
    name: Notify on success
    needs: build-and-deploy
    runs-on: ubuntu-latest
    if: success()
    
    steps:
      - name: Deployment success notification
        run: |
          echo "✅ Production build completed successfully!!"
          echo "🔗 Check your Vercel dashboard for the deployment URL"
          echo "📊 View deployment: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
